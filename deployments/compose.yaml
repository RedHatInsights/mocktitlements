services:
  mocktitlements:
    image: quay.io/cloudservices/mocktitlements:${MBOP_IMAGE_TAG:-latest}
    build:
      context: ../
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      KEYCLOAK_SERVER: http://keycloak:8080
      KEYCLOAK_USERNAME: admin
      KEYCLOAK_PASSWORD: change_me
    networks:
      - mocktitlements

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_IMAGE_TAG:-23.0.1}
    ports:
      - "8080:8080"
    command: ["start", "--import-realm", "--hostname-strict", "false", "--http-enabled", "true", "--http-relative-path", "/auth", "--health-enabled", "true", "--metrics-enabled", "true"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: change_me
      KEYCLOAK_IMPORT: /json/redhat-external-realm.json
      KC_DB_URL_HOST: postgres
      KC_DB_PASSWORD: change_me
      KC_DB_USERNAME: admin
      KC_DB_URL_DATABASE: test_db
      KC_DB: "postgres"
      KC_DB_URL_PORT: "5432"
      PROXY_ADDRESS_FORWARDING: "true"
    volumes:
      - type: bind
        source: ${PWD}/test/data/redhat-external-realm.json
        target: /opt/keycloak/data/import/redhat-external-realm.json${SELINUX_LABEL}
    networks:
      - mocktitlements

  postgres:
    image: registry.access.redhat.com/hi/postgresql:17.11@sha256:1fcfdb5a471611cacbdfb886c10c07183d366257e58148d416a8aa3d4c7e6dbf
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: change_me
      POSTGRES_USER: admin
      POSTGRES_DB: test_db
    networks:
      - mocktitlements

networks:
  mocktitlements:
    driver: bridge
